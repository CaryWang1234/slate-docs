<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="{{ICON}}">
<script>
  try {
    var saved = localStorage.getItem('slate-docs-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
</script>
<link rel="stylesheet" href="./assets/docs.css">
</head>
<body {{BODY_ATTRS}}>

<a class="skip-link" href="#main">跳到正文</a>

<header class="topbar">
  <div class="topbar-inner">
    <button class="icon-btn menu-btn" type="button" data-menu aria-label="打开导航" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>

    <a class="brand" href="./index.html">
      <img class="brand-logo" src="{{ICON}}" alt="">
      <span class="brand-name">SLATE</span>
      <span class="brand-sub">文档</span>
    </a>

    <button class="search-trigger" type="button" data-search-open>
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
      <span>搜索文档</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav class="topbar-links">
      <a href="https://slate-ai.site/" target="_blank" rel="noopener">官网</a>
      <a href="https://slate-ai.site/guide.html" target="_blank" rel="noopener">使用教程</a>
      <a href="https://github.com/CaryWang1234/SLATE" target="_blank" rel="noopener">GitHub</a>
    </nav>

    <button class="icon-btn theme-btn" type="button" data-theme-toggle aria-label="切换明暗主题">
      <svg class="ico-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.3A6.6 6.6 0 0 1 7.7 4a6.8 6.8 0 1 0 8.3 8.3Z"/></svg>
      <svg class="ico-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M15.7 4.3l-1.6 1.6M5.9 14.1l-1.6 1.6"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <div class="scrim" data-scrim hidden></div>

  <aside class="sidebar" data-sidebar aria-label="文档导航">
    <nav class="sidebar-nav">{{SIDEBAR}}</nav>
  </aside>

  <main class="main" id="main">
    <div class="main-inner">
      <nav class="breadcrumbs" aria-label="面包屑">{{BREADCRUMBS}}</nav>
      <article class="prose">{{CONTENT}}</article>
      <nav class="pager" aria-label="翻页">{{PAGER}}</nav>
      <footer class="site-footer">
        <span>SLATE（砚）· 本地 AI 协作调度台</span>
        <span>
          <a href="https://slate-ai.site/" target="_blank" rel="noopener">官网</a> ·
          <a href="https://slate-ai.site/guide.html" target="_blank" rel="noopener">使用教程</a> ·
          <a href="https://github.com/CaryWang1234/SLATE" target="_blank" rel="noopener">GitHub</a>
        </span>
        <span>MIT License · 文档随产品演进</span>
      </footer>
    </div>
  </main>

  <aside class="toc" data-toc aria-label="本页目录">{{TOC}}</aside>
</div>

<div class="search-overlay" data-search-overlay hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="搜索文档">
    <div class="search-field">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
      <input type="search" placeholder="搜索文档…" data-search-input autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" data-search-results></div>
    <div class="search-hint"><span>↑ ↓ 选择</span><span>Enter 打开</span><span>Esc 关闭</span></div>
  </div>
</div>

<script src="./assets/search-index.js"></script>
<script src="./assets/docs.js"></script>
</body>
</html>
